plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 25
                targetSdk = 37
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

apply from: 'api/manifest.gradle'
def gitCommitId = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
def gitCommitCount = 1
def baseVersionName = "2.0.0"
ext {
    // Keep versionCode a plain literal: F-Droid's scanner cannot evaluate
    // computed values (it reported versionCode 0). Bump by hand on release.
    versionCode = 2
    versionName = "${baseVersionName}.r${gitCommitCount}.${gitCommitId}"
}
